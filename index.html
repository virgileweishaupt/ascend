<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ascend" />
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <title>Ascend</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app"></main>

  <nav id="tabbar">
    <button data-act="tab" data-tab="today" class="tab">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg>
      <span>Aujourd'hui</span>
    </button>
    <button data-act="tab" data-tab="shop" class="tab">
      <svg viewBox="0 0 24 24"><path d="M4 9h16l-1.5 11h-13z"/><path d="M8.5 9V7a3.5 3.5 0 0 1 7 0v2"/></svg>
      <span>Boutique</span>
    </button>
    <button data-act="tab" data-tab="profile" class="tab">
      <svg viewBox="0 0 24 24"><path d="M12 3 3 20h18z"/><path d="M7.4 12h9.2M5.3 16h13.4"/></svg>
      <span>Pyramide</span>
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast-root"></div>
  <div id="fx-root"></div>

  <script src="app.js"></script>
</body>
</html>
